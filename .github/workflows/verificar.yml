name: Verificar pacote

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testar instalação e auxiliares
        run: python -m unittest discover -s tests -v
      - name: Conferir distribuição
        run: python scripts/verificar_pacote.py
